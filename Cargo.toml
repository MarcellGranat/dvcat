[package]
name = "dvc_tui"
version = "0.1.0"
edition = "2024"
description = "A minimal, modern terminal UI for DVC: browse the pipeline, see what is stale and why, run stages and experiments"
license = "MIT"
repository = "https://github.com/MarcellGranat/dvc-tui"
readme = "README.md"
keywords = ["dvc", "tui", "mlops"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
md-5 = "0.11.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"

[dev-dependencies]
tempfile = "3.27.0"
